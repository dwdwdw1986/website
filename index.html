<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的个人网站</title>
<style>
  :root {
    --bg-1: #eef2ff;
    --bg-2: #f5f3ff;
    --card-bg: rgba(255, 255, 255, 0.75);
    --card-border: rgba(255, 255, 255, 0.6);
    --text-main: #1e1b2e;
    --text-sub: #5b5675;
    --accent-1: #6366f1;
    --accent-2: #ec4899;
    --shadow: rgba(99, 102, 241, 0.25);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-1: #12101c;
      --bg-2: #1b1730;
      --card-bg: rgba(30, 27, 46, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f2f0fa;
      --text-sub: #b3aecb;
      --accent-1: #818cf8;
      --accent-2: #f472b6;
      --shadow: rgba(0, 0, 0, 0.45);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", Roboto, sans-serif;
    background: radial-gradient(circle at 20% 20%, var(--bg-2), var(--bg-1) 60%);
    color: var(--text-main);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    overflow-x: hidden;
    position: relative;
  }

  body::before,
  body::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.35;
    z-index: 0;
    animation: float 12s ease-in-out infinite;
  }

  body::before {
    width: 320px;
    height: 320px;
    background: var(--accent-1);
    top: -80px;
    left: -80px;
  }

  body::after {
    width: 260px;
    height: 260px;
    background: var(--accent-2);
    bottom: -60px;
    right: -60px;
    animation-delay: 3s;
  }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(20px, -20px) scale(1.08); }
  }

  .card {
    position: relative;
    z-index: 1;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 24px;
    padding: 56px 48px;
    max-width: 560px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px var(--shadow);
    animation: rise 0.7s ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 84px;
    height: 84px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    box-shadow: 0 8px 24px var(--shadow);
  }

  h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    margin: 0 0 12px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  p.subtitle {
    color: var(--text-sub);
    font-size: 1.05rem;
    line-height: 1.7;
    margin: 0 0 32px;
  }

  .links {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .links a {
    text-decoration: none;
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 600;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .links a.primary {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: #fff;
    box-shadow: 0 8px 20px var(--shadow);
  }

  .links a.secondary {
    color: var(--text-main);
    border: 1px solid var(--card-border);
    background: transparent;
  }

  .links a:hover {
    transform: translateY(-2px);
  }

  footer {
    margin-top: 36px;
    font-size: 0.8rem;
    color: var(--text-sub);
    opacity: 0.7;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="avatar">👋</div>
    <h1>Hello World!</h1>
    <p class="subtitle">欢迎来到我的网站，这里将记录我的想法、项目与生活点滴。</p>
    <div class="links">
      <a class="primary" href="mailto:dwdwdw1986@gmail.com">联系我</a>
      <a class="secondary" href="https://github.com/dwdwdw1986/website">GitHub</a>
    </div>
    <footer>&copy; 2026 我的个人网站</footer>
  </main>
</body>
</html>
